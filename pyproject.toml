[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "mascaf"
version = "1.2.0"
description = "Mesh and Skeleton Cable Fitting"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.5",
    "numpy>=2.3.3",
    "rtree>=1.4.1",
    "scipy>=1.16.1",
    "shapely>=2.1.1",
    "swctools",
    "trimesh>=4.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mascaf"]

[tool.hatch.build.targets.wheel.sources]
"mascaf" = "mascaf"

[tool.uv.sources]
swctools = { git = "https://github.com/jmrfox/swctools.git" }
apidump = { git = "https://github.com/jmrfox/apidump.git" }

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.6",
    "pillow>=12.0.0",
    "plotly>=6.3.0",
    "pyvista>=0.47.1",
    "kaleido",
]

[dependency-groups]
dev = [
    "apidump",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyter-server>=2.17.0",
    "jupytext>=1.19.1",
    "kaleido",
    "nbformat>=5.10.4",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pytest>=9.0.2",
    "matplotlib>=3.10.6",
    "pillow>=12.0.0",
    "pyvista>=0.47.1",
]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
]
